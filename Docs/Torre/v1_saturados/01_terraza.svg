<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr-path" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58d68d"/>
    </marker>
    <marker id="arr-ramp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b041"/>
    </marker>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#85c1e9"/>
    </marker>
    <marker id="arr-dim-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M10 1 L1 5 L10 9 z" fill="#85c1e9"/>
    </marker>
    <pattern id="hatch-hole" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f5b041" stroke-width="1.5" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Fondo oscuro estilo mapa_propuesto.svg. Centro de la torre (0,0) = (400, 410). Escala: 40 px = 1 m. Norte (90°) arriba -->
  <rect width="1200" height="820" fill="#1e2530"/>

  <!-- Grilla polar de referencia tenue -->
  <g stroke="#2c3646" stroke-width="1" fill="none">
    <line x1="20" y1="410" x2="780" y2="410"/>
    <line x1="400" y1="30" x2="400" y2="790"/>
    <circle cx="400" cy="410" r="192" stroke-dasharray="4 4"/>
    <circle cx="400" cy="410" r="248" stroke-dasharray="4 4"/>
  </g>

  <!-- Barrera mágica exterior (BarrierRadius = 9,2 m -> 368 px) -->
  <circle cx="400" cy="410" r="368" fill="none" stroke="#c678ff" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>
  <text x="400" y="34" text-anchor="middle" fill="#d9a6ff" font-size="11" font-style="italic">Barrera mágica exterior (r = 9,2 m · activa durante el tutorial)</text>

  <!-- Parapeto con almenas (TerraceOuter = 8,7 m -> 348 px, TerraceRadius = 8,2 m -> 328 px) -->
  <circle cx="400" cy="410" r="348" fill="#6e6254" stroke="#3b332b" stroke-width="2"/>
  <!-- Piso de piedra de la terraza y balcón en voladizo (r = 8,2 m -> 328 px) -->
  <circle cx="400" cy="410" r="328" fill="#464e59" stroke="#998b78" stroke-width="2"/>

  <!-- Reja de luz sobre el parapeto (r = 8,45 m -> 338 px) -->
  <circle cx="400" cy="410" r="338" fill="none" stroke="#b46bff" stroke-width="2" stroke-dasharray="3 6" opacity="0.8"/>

  <!-- Proyección del muro cilíndrico inferior (OuterRadius = 6,8 m -> 272 px, InnerRadius = 6,2 m -> 248 px) -->
  <circle cx="400" cy="410" r="272" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="410" r="248" fill="none" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Disco central de la terraza (r = 4,8 m -> 192 px): cerrado por baranda circular para obligar a cruzar viga y muro -->
  <circle cx="400" cy="410" r="192" fill="#39404a" stroke="#8e6b4a" stroke-width="4"/>
  <text x="400" y="398" text-anchor="middle" fill="#9aa6b5" font-size="11.5" font-weight="600">Disco central (r = 4,8 m · Ø 9,6 m)</text>
  <text x="400" y="416" text-anchor="middle" fill="#7f8c9a" font-size="10.5">Cerrado por baranda (h = 1,0 m) y sin pedestal de</text>
  <text x="400" y="432" text-anchor="middle" fill="#7f8c9a" font-size="10.5">«Signos raros» (mudado al Archivo) para no rodear los obstáculos</text>

  <!-- HUECO DE LA RAMPA (HoleFrom = 48° a HoleTo = 180°, r = 4,8..6,15 m -> 192..246 px) -->
  <path d="M 528.5 267.3 A 192 192 0 0 0 208 410 L 154 410 A 246 246 0 0 1 564.6 227.2 Z"
        fill="#191e26" stroke="#f5b041" stroke-width="2"/>
  <path d="M 528.5 267.3 A 192 192 0 0 0 208 410 L 154 410 A 246 246 0 0 1 564.6 227.2 Z"
        fill="url(#hatch-hole)"/>

  <!-- Baranda exterior del hueco de rampa (r = 6,2 m -> 248 px, de 48° a 170°) y cierre en 48° -->
  <path d="M 565.9 225.7 A 248 248 0 0 0 155.8 366.9" fill="none" stroke="#a06a3b" stroke-width="5" stroke-linecap="round"/>
  <line x1="528.5" y1="267.3" x2="565.9" y2="225.7" stroke="#a06a3b" stroke-width="5" stroke-linecap="round"/>

  <!-- Flecha de bajada por la rampa (entra en 180° Oeste y baja en sentido horario hacia 48° -> 0° Este en Piso 2) -->
  <path d="M 181 395 A 219 219 0 0 1 495 213" fill="none" stroke="#f5b041" stroke-width="3.5" stroke-dasharray="7 4" marker-end="url(#arr-ramp)"/>
  <text x="315" y="192" text-anchor="middle" fill="#f8c471" font-size="11" font-weight="700" transform="rotate(-18 315 192)">BAJADA A PISO 2 (180° → 90° → 0°, pendiente 14,7°)</text>
  <text x="195" y="382" text-anchor="end" fill="#f8c471" font-size="10.5" font-weight="700">Boca rampa (180° · y=13,5m)</text>

  <!-- ZONAS DE TRABAJO LIBRES ACOTADAS (verde punteado) -->
  <g fill="#58d68d" fill-opacity="0.08" stroke="#58d68d" stroke-width="1.5" stroke-dasharray="5 4">
    <!-- Zona 1: Inicio + Palanca (65°..112°, r=4.8..8.2m -> 4,5 x 3,4 m) -->
    <path d="M 481 236 A 192 192 0 0 0 328 232 L 277 106 A 328 328 0 0 1 538 113 Z"/>
    <!-- Zona 2: Ejercicio Agacharse (45°..5°, r=4.8..8.2m -> 6,5 x 3,4 m) -->
    <path d="M 591 393 A 192 192 0 0 0 536 274 L 632 178 A 328 328 0 0 1 726 381 Z"/>
    <!-- Zona 3: Ejercicio Saltar (345°..305°, r=4.8..8.2m -> 6,5 x 3,4 m) -->
    <path d="M 510 567 A 192 192 0 0 0 585 460 L 716 495 A 328 328 0 0 1 588 678 Z"/>
    <!-- Zona 4: Descanso previo a Reja y Rampa (240°..185°, r=4.8..8.2m -> 5,5 x 3,4 m) -->
    <path d="M 209 427 A 192 192 0 0 0 304 576 L 236 694 A 328 328 0 0 1 73 439 Z"/>
  </g>
  <g fill="#a3e4d7" font-size="10.5" font-weight="600" text-anchor="middle">
    <text x="418" y="155">Zona Inicio: 4,5 × 3,4 m</text>
    <text x="655" y="348">Zona Viga: 6,5 × 3,4 m</text>
    <text x="645" y="555">Zona Muro: 6,5 × 3,4 m</text>
    <text x="200" y="618">Descanso Reja: 5,5 × 3,4 m</text>
  </g>

  <!-- 10 Postes del techo sobre el muro (PostRadius = 6,5 m -> 260 px, cada 36°) -->
  <g fill="#5c3a21" stroke="#e67e22" stroke-width="1.5">
    <circle cx="660" cy="410" r="6"/><circle cx="610" cy="257" r="6"/><circle cx="480" cy="163" r="6"/>
    <circle cx="320" cy="163" r="6"/><circle cx="190" cy="257" r="6"/><circle cx="140" cy="410" r="6"/>
    <circle cx="190" cy="563" r="6"/><circle cx="320" cy="657" r="6"/><circle cx="480" cy="657" r="6"/>
    <circle cx="610" cy="563" r="6"/>
  </g>

  <!-- OBSTÁCULO OESTE: Valla alta de tablas (FenceAngle = 115°, r = 4,8..8,2 m, h = 2,4 m) -->
  <line x1="318.9" y1="236.0" x2="261.4" y2="112.7" stroke="#c0392b" stroke-width="9" stroke-linecap="butt"/>
  <line x1="318.9" y1="236.0" x2="261.4" y2="112.7" stroke="#f5b7b1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="242" y="102" text-anchor="end" fill="#f1948a" font-weight="700" font-size="11">Valla alta (115° · r=4,8..8,2m · h=2,4m)</text>
  <text x="242" y="116" text-anchor="end" fill="#e6b0aa" font-size="10">Cierra el paso oeste</text>

  <!-- PALANCA DE SALTEO (r = 7,4 m, ang = 102°) -->
  <rect x="330" y="112" width="16" height="16" rx="3" fill="#e74c3c" stroke="#ffffff" stroke-width="2"/>
  <text x="325" y="95" text-anchor="end" fill="#ff9f89" font-weight="700" font-size="11">Palanca salteo (102° · r=7,4m)</text>

  <!-- SPAWN DEL JUGADOR (r = 6,8 m, ang = 90°, mirando al Este 72°) -->
  <polygon points="400,124 412,138 400,152 388,138" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.5"/>
  <text x="400" y="105" text-anchor="middle" fill="#ffffff" font-weight="800" font-size="12">SPAWN TUTORIAL (90° · r=6,8m · y=13,5m)</text>

  <!-- OBSTÁCULO 1: Viga baja para agacharse (BeamAngle = 25°, r = 4,8..8,2 m, luz libre = 1,30 m) -->
  <line x1="574.0" y1="328.9" x2="697.3" y2="271.4" stroke="#d35400" stroke-width="10" stroke-linecap="butt"/>
  <line x1="574.0" y1="328.9" x2="697.3" y2="271.4" stroke="#fad7a0" stroke-width="2.5" stroke-dasharray="8 4"/>
  <text x="712" y="264" text-anchor="start" fill="#f8c471" font-weight="700" font-size="11.5">Viga baja (25° · r=4,8..8,2m)</text>
  <text x="712" y="279" text-anchor="start" fill="#f5cba7" font-size="10.5">Luz libre y=1,30m · pasar con C</text>
  <!-- Farol testigo 1 (Crouch) en r = 7,6 m, ang = 22° -->
  <circle cx="682" cy="296" r="7" fill="#ffe48a" stroke="#7a5a12" stroke-width="2"/>
  <text x="694" y="301" fill="#ffe48a" font-size="10" font-weight="600">Testigo C (22° · r=7,6m)</text>

  <!-- OBSTÁCULO 2: Muro bajo para saltar (JumpWallAngle = 325°, r = 4,8..8,2 m, alto = 0,70 m) -->
  <line x1="557.3" y1="520.1" x2="668.7" y2="598.1" stroke="#7f8c8d" stroke-width="11" stroke-linecap="butt"/>
  <line x1="557.3" y1="520.1" x2="668.7" y2="598.1" stroke="#ecf0f1" stroke-width="2.5"/>
  <text x="682" y="602" text-anchor="start" fill="#d5dbdb" font-weight="700" font-size="11.5">Muro bajo (325° · r=4,8..8,2m)</text>
  <text x="682" y="617" text-anchor="start" fill="#bdc3c7" font-size="10.5">Alto h=0,70m · saltar con Espacio</text>
  <!-- Farol testigo 2 (Jump) en r = 7,6 m, ang = 322° -->
  <circle cx="640" cy="597" r="7" fill="#ffe48a" stroke="#7a5a12" stroke-width="2"/>
  <text x="630" y="620" text-anchor="end" fill="#ffe48a" font-size="10" font-weight="600">Testigo Salto (322° · r=7,6m)</text>

  <!-- OBSTÁCULO 3: Reja mágica de la rampa (GateAngle = 195°, r = 4,8..6,2 m) -->
  <line x1="214.5" y1="459.7" x2="160.5" y2="474.2" stroke="#c678ff" stroke-width="8" stroke-dasharray="5 3"/>
  <text x="148" y="480" text-anchor="end" fill="#e0b0ff" font-weight="700" font-size="11.5">Reja mágica (195° · r=4,8..6,2m)</text>
  <text x="148" y="495" text-anchor="end" fill="#c9a0dc" font-size="10.5">Se apaga al cumplir C + Espacio</text>

  <!-- CAMINO DEL JUGADOR (sentido horario por el balcón este y sur hasta la rampa en 180°) -->
  <path d="M 412 140 A 268 268 0 0 1 655 325 A 268 268 0 0 1 595 595 A 268 268 0 0 1 250 630 Q 185 565 182 430"
        fill="none" stroke="#58d68d" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arr-path)"/>

  <!-- CARTELES NUMERADOS (#1 a #5) — cada uno ANTES de lo que explica -->
  <g font-weight="800" font-size="13" text-anchor="middle">
    <!-- #1 Skip -->
    <circle cx="352" cy="118" r="12" fill="#f4d03f" stroke="#1b1b1b" stroke-width="2"/>
    <text x="352" y="123" fill="#1b1b1b">1</text>
    <!-- #2 Caminar -->
    <circle cx="484" cy="151" r="12" fill="#f4d03f" stroke="#1b1b1b" stroke-width="2"/>
    <text x="484" y="156" fill="#1b1b1b">2</text>
    <!-- #3 Agacharse (en 40°, antes de la viga en 25°) -->
    <circle cx="602" cy="240" r="12" fill="#f4d03f" stroke="#1b1b1b" stroke-width="2"/>
    <text x="602" y="245" fill="#1b1b1b">3</text>
    <!-- #4 Saltar (en 342°, antes del muro en 325°) -->
    <circle cx="651" cy="492" r="12" fill="#f4d03f" stroke="#1b1b1b" stroke-width="2"/>
    <text x="651" y="497" fill="#1b1b1b">4</text>
    <!-- #5 Reja (en 212°, antes de la reja en 195°) -->
    <circle cx="213" cy="527" r="12" fill="#f4d03f" stroke="#1b1b1b" stroke-width="2"/>
    <text x="213" y="532" fill="#1b1b1b">5</text>
  </g>

  <!-- COTAS DIMENSIONALES -->
  <g stroke="#85c1e9" stroke-width="1.5" fill="#85c1e9" font-size="11" font-weight="600">
    <!-- Ancho del corredor de la terraza (r = 4,8..8,2 m = 3,4 m) al sur (270°) -->
    <line x1="400" y1="602" x2="400" y2="738" marker-start="url(#arr-dim-start)" marker-end="url(#arr-dim)"/>
    <text x="410" y="674" stroke="none">Corredor libre: 3,40 m (r=4,8..8,2m)</text>
    <!-- Radio del disco central (r = 4,8 m) -->
    <line x1="400" y1="410" x2="208" y2="410" marker-start="url(#arr-dim-start)" marker-end="url(#arr-dim)"/>
    <text x="304" y="402" text-anchor="middle" stroke="none">r = 4,80 m</text>
    <!-- Ancho de la rampa (r = 4,8..6,15 m = 1,35 m) -->
    <line x1="154" y1="410" x2="208" y2="410" marker-start="url(#arr-dim-start)" marker-end="url(#arr-dim)"/>
    <text x="181" y="428" text-anchor="middle" stroke="none">1,35 m</text>
  </g>

  <!-- Brújula y referencias angulares -->
  <g transform="translate(65, 85)" fill="#f0f0f0" stroke="#f0f0f0">
    <path d="M0 24 L0 -24 M-7 -12 L0 -26 L7 -12" fill="none" stroke-width="2.5"/>
    <text x="0" y="-32" text-anchor="middle" stroke="none" font-weight="800" font-size="13">N (90°)</text>
    <text x="0" y="40" text-anchor="middle" stroke="none" font-size="10" fill="#aab4c0">S (270°)</text>
    <text x="34" y="4" text-anchor="start" stroke="none" font-size="10" fill="#aab4c0">E (0°)</text>
    <text x="-34" y="4" text-anchor="end" stroke="none" font-size="10" fill="#aab4c0">O (180°)</text>
  </g>

  <!-- Barra de escala (40 px = 1 m -> 200 px = 5 m) -->
  <g transform="translate(40, 775)" fill="#f0f0f0">
    <rect x="0" y="0" width="200" height="6" fill="#85c1e9"/>
    <line x1="0" y1="-4" x2="0" y2="10" stroke="#85c1e9" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="8" stroke="#1e2530" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="8" stroke="#1e2530" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="8" stroke="#1e2530" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="8" stroke="#1e2530" stroke-width="1.5"/>
    <line x1="200" y1="-4" x2="200" y2="10" stroke="#85c1e9" stroke-width="2"/>
    <text x="100" y="-8" text-anchor="middle" font-weight="700" font-size="12">5 m (Escala: 40 px = 1 m)</text>
  </g>

  <!-- PANEL DE LEYENDA DERECHO -->
  <rect x="800" y="20" width="380" height="780" rx="10" fill="#252e3b" stroke="#394659" stroke-width="1.5"/>
  <g transform="translate(822, 50)" fill="#e9edf2">
    <text font-size="18" font-weight="800" fill="#ffffff">Nivel 1 · Terraza (y = 13,50 m)</text>
    <text y="22" fill="#85c1e9" font-size="12.5" font-weight="600">Tema: Movilidad básica (caminar, agacharse, saltar)</text>

    <text y="54" font-weight="700" font-size="13.5" fill="#f8c471">Cotas y geometría del piso</text>
    <g font-size="11.5" fill="#d0d8e2">
      <text y="74">• Radio terraza útil: r = 8,20 m (Ø 16,40 m, parapeto a 8,70 m)</text>
      <text y="92">• Corredor perimetral: r = 4,80..8,20 m (ancho libre 3,40 m)</text>
      <text y="110">• Disco central: r = 0..4,80 m (cerrado por baranda h = 1,0 m)</text>
      <text y="128">• Hueco de rampa: 48° a 180° (r = 4,80..6,15 m, ancho 1,35 m)</text>
      <text y="146">• Postes del techo: 10 postes sobre el muro (r = 6,50 m)</text>
    </g>

    <text y="180" font-weight="700" font-size="13.5" fill="#58d68d">Recorrido paso a paso (sentido horario)</text>
    <g font-size="11.5" fill="#d0d8e2">
      <text y="200">1. Spawn en (90°, r=6,8m) mirando al Este (72°).</text>
      <text y="218">2. Valla alta en 115° impide ir al oeste; palanca en 102°.</text>
      <text y="236">3. Avanza al Este: lee cartel #3 (40°) y pasa agachado</text>
      <text y="252">   con C bajo la viga en 25° → enciende testigo 1.</text>
      <text y="270">4. Sigue al Sureste: lee cartel #4 (342°) y salta con</text>
      <text y="286">   Espacio el muro en 325° → enciende testigo 2.</text>
      <text y="304">5. Con ambos testigos encendidos se apaga la reja (195°)</text>
      <text y="320">   y baja por la rampa en 180° hacia el Piso 2 (0°).</text>
    </g>

    <text y="354" font-weight="700" font-size="13.5" fill="#f4d03f">Carteles del piso (todos ANTES del obstáculo)</text>
    <g font-size="11.5" fill="#e9edf2">
      <circle cx="10" cy="372" r="9" fill="#f4d03f"/><text x="10" y="376" text-anchor="middle" fill="#111" font-weight="800">1</text>
      <text x="26" y="376">(100°, r=7,4m) «E Saltear tutorial» (1,10 × 0,42 m)</text>

      <circle cx="10" cy="396" r="9" fill="#f4d03f"/><text x="10" y="400" text-anchor="middle" fill="#111" font-weight="800">2</text>
      <text x="26" y="400">(72°, r=6,8m) «WASD caminar · Mouse mirar»</text>

      <circle cx="10" cy="420" r="9" fill="#f4d03f"/><text x="10" y="424" text-anchor="middle" fill="#111" font-weight="800">3</text>
      <text x="26" y="424">(40°, r=6,6m) «Mantené C para agacharte»</text>

      <circle cx="10" cy="444" r="9" fill="#f4d03f"/><text x="10" y="448" text-anchor="middle" fill="#111" font-weight="800">4</text>
      <text x="26" y="448">(342°, r=6,6m) «Apretá Espacio para saltar»</text>

      <circle cx="10" cy="468" r="9" fill="#f4d03f"/><text x="10" y="472" text-anchor="middle" fill="#111" font-weight="800">5</text>
      <text x="26" y="472">(212°, r=5,5m) «Agachate y saltá para abrir»</text>
    </g>

    <text y="506" font-weight="700" font-size="13.5" fill="#ffffff">Simbología</text>
    <g font-size="11.5" fill="#d0d8e2">
      <polygon points="10,518 18,526 10,534 2,526" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <text x="28" y="530">Spawn del jugador (90°, r=6,8m)</text>

      <rect x="4" y="542" width="12" height="12" rx="2" fill="#e74c3c" stroke="#fff"/>
      <text x="28" y="552">Palanca de salteo (102°, r=7,4m)</text>

      <line x1="0" y1="569" x2="20" y2="569" stroke="#d35400" stroke-width="6"/>
      <text x="28" y="573">Viga baja (luz 1,30 m) / Valla alta (2,40 m)</text>

      <line x1="0" y1="591" x2="20" y2="591" stroke="#7f8c8d" stroke-width="6"/>
      <text x="28" y="595">Muro de salto de piedra (alto 0,70 m)</text>

      <line x1="0" y1="613" x2="20" y2="613" stroke="#c678ff" stroke-width="5" stroke-dasharray="4 3"/>
      <text x="28" y="617">Reja mágica / Barrera del tutorial</text>

      <circle cx="10" cy="635" r="6" fill="#ffe48a" stroke="#7a5a12" stroke-width="1.5"/>
      <text x="28" y="639">Farolito testigo de acción (agacharse / saltar)</text>

      <path d="M0 658 h20" stroke="#58d68d" stroke-width="3.5" stroke-dasharray="6 4"/>
      <text x="28" y="662">Camino natural del jugador</text>

      <path d="M0 680 h20" stroke="#f5b041" stroke-width="3.5" stroke-dasharray="5 3"/>
      <text x="28" y="684">Pendiente de bajada de la rampa</text>
    </g>

    <text y="716" font-weight="700" font-size="12" fill="#f1948a">Cambios clave respecto a la versión probada:</text>
    <text y="734" font-size="11" fill="#c6cfda">• Se eliminó el libro «Signos raros» y su pedestal de la terraza.</text>
    <text y="750" font-size="11" fill="#c6cfda">• La baranda r=4,8m impide rodear la viga o el muro por el centro.</text>
  </g>
</svg>
